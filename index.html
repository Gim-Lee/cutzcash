<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cutz Cash">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Cutz Cash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: zwarte pagina, één witte kaart met het grote getal onder een barberpaal-streep, drie knoppen direct onder het getal. Kleuren komen uit het ZR Cutz-logo: zwart, wit, blauw, rood. */
:root {
  --black: #0B0B0C;
  --card-dark: #19191C;
  --line: #2C2C31;
  --white: #FFFFFF;
  --paper: #F4F4F5;
  --ink: #0B0B0C;
  --muted-on-white: #55555C;
  --muted-on-dark: #A9A9B1;
  --blue: #2D5FB0;
  --blue-text: #8DB2F2;
  --red: #C62828;
  --red-text: #FF7A7A;
  --red-on-white: #B71C1C;
  --blue-on-white: #234E96;
  --scrim: rgba(0, 0, 0, .7);
  --display: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --pole: repeating-linear-gradient(-45deg, var(--red) 0 14px, var(--white) 14px 28px, var(--blue) 28px 42px, var(--white) 42px 56px);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
html { background: var(--black); }
body {
  background: var(--black); color: var(--white); font-family: var(--body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 0;
}
.wrap { max-width: 480px; margin-inline: auto; display: flex; flex-direction: column; gap: 14px; min-height: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--white); outline-offset: 2px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
.brand img { width: 112px; height: 112px; border-radius: 50%; display: block; flex: none; }
h1 { font-family: var(--display); font-weight: 400; font-size: 30px; white-space: nowrap; line-height: 1; margin: 0; letter-spacing: .04em; }
.link { background: none; border: 0; padding: 10px 4px; color: var(--muted-on-dark); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }

.main { background: var(--white); color: var(--ink); border-radius: 20px; overflow: hidden; }
.main .pole { height: 14px; background: var(--pole); }
.main .body { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 2px; }
.main .label { font-weight: 700; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-on-white); }
.main .amount { font-family: var(--display); font-size: 58px; line-height: 1; letter-spacing: .01em; font-variant-numeric: tabular-nums; }
.main.neg .amount { color: var(--red-on-white); }
.main .warn { font-size: 14px; color: var(--red-on-white); font-weight: 700; margin: 0; }
.month { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; padding-top: 14px; border-top: 2px solid var(--ink); }
.month .cap { grid-column: 1 / -1; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted-on-white); }
.month div { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.month small { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted-on-white); }
.month b { font-family: var(--display); font-weight: 400; font-size: 22px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.month .in b { color: var(--blue-on-white); }
.month .out b { color: var(--red-on-white); }

.banner { background: var(--card-dark); border: 1px dashed var(--muted-on-dark); border-radius: 14px; padding: 12px 14px; font-size: 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.banner button { background: var(--white); color: var(--ink); border: 0; border-radius: 10px; padding: 10px 14px; font-weight: 700; }

h2 { font-family: var(--display); font-weight: 400; font-size: 20px; letter-spacing: .1em; color: var(--muted-on-dark); margin: 6px 0 0; }
ul.list { list-style: none; margin: 0; padding: 0; background: var(--card-dark); border-radius: 16px; overflow: hidden; }
ul.list li { border-top: 1px solid var(--line); }
ul.list li:first-child { border-top: 0; }
.row { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: baseline; background: none; border: 0; text-align: left; padding: 12px 16px; min-height: 52px; }
.row .t { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.row .d { color: var(--muted-on-dark); font-size: 13px; grid-column: 1; }
.row .a { grid-row: 1 / span 2; grid-column: 2; font-weight: 700; font-variant-numeric: tabular-nums; align-self: center; }
.a.plus { color: var(--blue-text); } .a.minus { color: var(--red-text); } .a.ber { color: var(--white); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--line); color: var(--muted-on-dark); margin-left: 6px; vertical-align: 1px; }
.del { display: flex; gap: 10px; padding: 0 16px 12px; }
.del button { border-radius: 10px; padding: 10px 14px; font-weight: 700; border: 1px solid var(--muted-on-dark); background: none; }
.del .danger { background: var(--red); border-color: var(--red); color: #fff; }
.empty { background: var(--card-dark); border-radius: 16px; padding: 18px; color: var(--muted-on-dark); }
.more { align-self: center; }

.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.actions button { border: 0; border-radius: 16px; min-height: 68px; padding: 8px 4px; font-weight: 700; font-size: 14px; line-height: 1.15; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.actions .sym { font-family: var(--display); font-weight: 400; font-size: 28px; line-height: 1; }
.act-klus { background: var(--blue); }
.act-uit { background: var(--red); }
.act-ber { background: var(--white); color: var(--ink) !important; }
.goal { background: transparent; border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 10px; display: flex; flex-direction: column; gap: 6px; }
.goal p { margin: 0; }
.g-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; color: var(--muted-on-dark); font-variant-numeric: tabular-nums; }
.g-name { font-weight: 700; color: var(--muted-on-dark); }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--pole); border-radius: 99px; min-width: 4px; }
.g-save { background: transparent; color: var(--white); border: 1px solid var(--muted-on-dark); border-radius: 10px; min-height: 36px; padding: 0 12px; font: inherit; font-size: 13px; font-weight: 700; }
.a.opz { color: var(--white); }
.foot { font-size: 12px; color: var(--muted-on-dark); margin: 0; }

.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { width: 100%; max-width: 480px; background: var(--white); color: var(--ink); border-radius: 22px 22px 0 0; padding: 0 20px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 92%; overflow-y: auto; }
.sheet .pole { height: 12px; margin: 0 -20px 6px; background: var(--pole); flex: none; }
.sheet h3 { font-family: var(--display); font-size: 30px; margin: 0; font-weight: 400; letter-spacing: .05em; line-height: 1; }
.sheet label { font-size: 13px; font-weight: 700; color: var(--muted-on-white); display: block; margin-bottom: 4px; }
.sheet select, .sheet input[type=text], .sheet input[type=date] { width: 100%; font: inherit; font-size: 17px; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); }
.sheet select { appearance: none; }
.sheet input, .sheet select { box-sizing: border-box; }
.sheet input[type=date] { -webkit-appearance: none; appearance: none; display: block; width: 100%; min-width: 100%; height: 52px; text-align: left; }
.sheet input[type=date]::-webkit-date-and-time-value { text-align: left; }
.sheet .big { font-family: var(--display); font-size: 48px; line-height: 1.1; padding: 6px 14px; font-variant-numeric: tabular-nums; }
.sheet .err { color: var(--red-on-white); font-weight: 700; font-size: 14px; min-height: 1.2em; margin: 0; }
.sheet .go { border: 0; border-radius: 14px; min-height: 56px; font-weight: 700; font-size: 17px; color: #fff; }
.sheet .inrow { display: flex; gap: 8px; align-items: stretch; }
.sheet .inrow input[type=text] { flex: 1; min-width: 0; }
.sheet .cambtn { flex: 0 0 52px; border: 2px solid var(--ink); background: var(--ink); color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; padding: 0; }
.sheet .cambtn:active { background: var(--white); color: var(--ink); }
.sheet .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.sheet .chip { border: 2px solid var(--ink); background: var(--white); color: var(--ink); border-radius: 999px; padding: 8px 14px; font: inherit; font-size: 15px; font-weight: 700; min-height: 40px; }
.sheet .chip:active { background: var(--ink); color: #fff; }
.sheet .hint { margin: 8px 0 0; font-size: 13px; color: var(--muted-on-white); line-height: 1.4; }
.sheet .clients { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.sheet .clients li { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 2px solid var(--ink); border-radius: 12px; padding: 10px 14px; background: var(--paper); }
.sheet .clients li.old { border-style: dashed; }
.sheet .clients b { font-size: 17px; }
.sheet .clients small { display: block; font-size: 13px; color: var(--muted-on-white); }
.sheet .clients .cl-r { text-align: right; flex: none; }
.sheet .go.ber { background: var(--ink); }
.sheet .link { color: var(--muted-on-white); }
.sheet .cancel { align-self: center; }
.menu { display: flex; flex-direction: column; gap: 10px; }
.menu button.opt { text-align: left; border: 2px solid var(--ink); background: var(--paper); border-radius: 14px; padding: 14px; font-weight: 700; }
.menu button.opt small { display: block; font-weight: 400; color: var(--muted-on-white); margin-top: 2px; }
.menu button.opt.danger { color: var(--red-on-white); border-color: var(--red-on-white); }
.note { font-size: 14px; color: var(--muted-on-white); margin: 0; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>
</head>

        break;
    }
    render();
    if (pending) sendLines(pending);
  });

  try { applyGoal(JSON.parse(localStorage.getItem("cutzcash.goal"))); } catch (e) {}
  load();
  render();
  try {
    fetch("doel.json", { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (g) {
      if (!applyGoal(g)) return;
      try { localStorage.setItem("cutzcash.goal", JSON.stringify(g)); } catch (e) {}
      state.entries.forEach(function (e) { if (e.t === "opzij") { e.g = 0; e.n = GOAL.name; } });
